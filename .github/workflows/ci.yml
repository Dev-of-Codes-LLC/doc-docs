name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The org allows only GitHub-owned actions, pinned to a commit.

jobs:
  test:
    name: Tests and a real build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m playwright install --with-deps chromium
      - name: Unit tests
        run: python -m unittest discover tests -v
      - name: Check the example storyboard
        run: docdocs check examples/cards/storyboard.json
      - name: Build the example with a silent voice (records, stitches, encodes)
        run: docdocs build examples/cards/storyboard.json --voice silent
      - name: The videos exist and have a picture
        shell: bash
        run: |
          for f in examples/cards/build/cards-16x9.mp4 examples/cards/build/cards-9x16.mp4; do
            test -s "$f" || { echo "missing $f"; exit 1; }
            echo "$f: $(wc -c < "$f") bytes"
          done
