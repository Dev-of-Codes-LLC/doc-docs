<div class="stage">
  <p class="kicker in" style="--d: 100ms">${kicker}</p>
  <h1 class="title in" style="--d: 250ms">${label}</h1>
  <div class="metric">
    <div class="before in" style="--d: 600ms"><div class="value">${before_value}</div><div class="tag">${before_label}</div></div>
    <div class="arrow in" style="--d: 1000ms">&rarr;</div>
    <div class="after in" style="--d: 1400ms"><div class="value">${after_value}</div><div class="tag">${after_label}</div></div>
  </div>
  <p class="note in" style="--d: 1900ms">${note}</p>
  <div class="mark">${mark}</div>
</div>
